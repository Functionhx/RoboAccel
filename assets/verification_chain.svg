<text x="20" y="27" class="band-title">Figure 3 One arithmetic, five implementations</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C8C8C"/></marker></defs>
<rect x="300" y="66" width="280" height="62" rx="3" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
<text x="440" y="90" text-anchor="middle" font-size="15.5" font-weight="600">NumPy integer reference</text>
<text x="440" y="112" text-anchor="middle" class="cap">the arbiter: it defines what is correct</text>
<rect x="24" y="208" width="196" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
<text x="38" y="234" font-size="14" font-weight="600">PyTorch fake-quant</text>
<text x="38" y="258" font-size="13" font-weight="600" fill="#000000">9/9 tensors exact</text>
<text x="38" y="278" class="cap">4000 samples</text>
<text x="38" y="294" font-size="10.5" style="fill:#8C8C8C">on the host</text>
<path d="M440,128 V166 H122 V204" stroke="#000000" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
<rect x="236" y="208" width="196" height="92" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
<text x="250" y="234" font-size="14" font-weight="600">FPGA descriptors</text>
<text x="250" y="258" font-size="13" font-weight="600" fill="#000000">13 instructions</text>
<text x="250" y="278" class="cap">7 weight fracs</text>
<text x="250" y="294" font-size="10.5" style="fill:#8C8C8C">on the host</text>
<path d="M440,128 V166 H334 V204" stroke="#000000" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
<rect x="448" y="208" width="196" height="92" rx="3" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
<text x="462" y="234" font-size="14" font-weight="600">STM32 scalar C</text>
<text x="462" y="258" font-size="13" font-weight="600" fill="#C2410C">0 mismatches</text>
<text x="462" y="278" class="cap">24 golden vectors</text>
<text x="462" y="294" font-size="10.5" style="fill:#C2410C">on silicon</text>
<path d="M440,128 V166 H546 V204" stroke="#C2410C" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
<rect x="660" y="208" width="196" height="92" rx="3" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
<text x="674" y="234" font-size="14" font-weight="600">STM32 SMLALD SIMD</text>
<text x="674" y="258" font-size="13" font-weight="600" fill="#C2410C">0 mismatches</text>
<text x="674" y="278" class="cap">24 golden vectors</text>
<text x="674" y="294" font-size="10.5" style="fill:#C2410C">on silicon</text>
<path d="M440,128 V166 H758 V204" stroke="#C2410C" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
<line x1="16" y1="336" x2="864" y2="336" stroke="#D8D8D8"/>
<text x="20" y="358" class="cap">A controller correct in PyTorch but different on the target has not been validated. Each path re-derives the arithmetic on its own:</text>
<text x="20" y="377" class="cap">the FPGA exporter shares no code with the quantization library, yet derives the same program and the same per-layer scales.</text>
