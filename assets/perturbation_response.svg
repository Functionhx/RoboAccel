<text x="20" y="446" font-size="13">Over a <tspan font-weight="600">2563x</tspan> span of step size, float KL rises <tspan font-weight="600">6.19e6x</tspan> — exactly quadratic. W8A8 rises only <tspan font-weight="600">68x</tspan>.</text>
<text x="20" y="465" font-size="13">W8A16 and W8A8 have the same 8-bit weights and cross the same boundaries, yet differ by <tspan font-weight="600">~70x</tspan> in KL: the amplifier is the activation path.</text>
