<line x1="20" y1="330" x2="880" y2="330" stroke="#ddd"/>
<text x="20" y="350" class="tag">Fake-quant makes the policy a discontinuous function of its weights, so PPO's adaptive learning-rate controller reads quantization noise as policy divergence</text>
<text x="20" y="367" class="tag">and cuts the learning rate. In the W8A8 run it stayed at the 1e-5 floor for 2000 of 2000 iterations; the FP32 control, 10 of 2000.</text>
<text x="20" y="384" class="tag">Source: docs/results/kl_amplification_qat.json · docs/results/goal4_results.json</text>
