<text x="20" y="418" font-size="13">Fake-quant makes the policy a <tspan font-weight="600">discontinuous</tspan> function of its weights, so PPO reads quantization noise as policy divergence</text>
<text x="20" y="437" font-size="13">and cuts the learning rate. In the W8A8 run it sat at the 1e-5 floor for <tspan font-weight="600">2000 of 2000 iterations</tspan>; the FP32 control, 10 of 2000.</text>
